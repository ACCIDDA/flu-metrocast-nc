name: 'Check NC GitHub authentication'

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: "${{ github.repository == 'ACCIDDA/flu-metrocast-nc' }}"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: "${{ secrets.FLU_METROCAST_NC }}"
    steps:
      - name: 'Check token authentication'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::FLU_METROCAST_NC is unavailable to this job.'
            exit 1
          fi
          gh api user --jq '"Authenticated as: " + .login'
      - name: 'Check NC repository permissions'
        run: |
          gh api repos/ACCIDDA/flu-metrocast-nc \
            --jq '{repository: .full_name, permissions: .permissions}'
